<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="estilos css.css">
    <title>Pseudoselectores</title>
</head>
    <body>
        <table>
            <caption>HORARIO DE CLASE CURSO 2023-2024</caption>
            <thead>
                <tr>
                    <th>HORAS</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miercoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>8:00</td>
                    <td rowspan="2">Matematicas</td>
                    <td>Lengua</td>
                    <td>Ingles</td>
                    <td colspan="2">Ciencias</td>
                </tr>
                <tr>
                    <td>9:00</td>
                    <td>Historia</td>
                    <td>Ciencias</td>
                    <td>Matemáticas</td>
                    <td>Lengua</td>
                </tr>
                <tr>
                    <td>10:00</td>
                    <td colspan="5">RECREO</td>
                </tr>
                <tr>
                    <td>10:30</td>
                    <td>Ingles</td>
                    <td rowspan="2">Ciencias</td>
                    <td>Matematicas</td>
                    <td>Lengua</td>
                    <td>Historia</td>
                </tr>
                <tr>
                    <td>11:30</td>
                    <td>Historia</td>
                    <td>Ciencias</td>
                    <td>Matematicas</td>
                    <td>Ingles</td>
                </tr>
            </tbody>
        </table>
        <form action="pagina.pgp" method="get">
            <p><label for="correo">Email</label>
            <input type="email" name="email" size="30" placeholder="Inserte email del destinatario" required></p>
            <input type="submit" value="Enviar Horario">
        </form>
    </body>
</html>
